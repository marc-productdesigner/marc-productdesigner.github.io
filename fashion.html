  <style>
    /* ── Photography tab switcher ── */
    .photo-page { max-width: var(--max-width); margin: 0 auto; padding: 60px 40px 80px; }

    .photo-hero { margin-bottom: 48px; }
    .photo-hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 32px; }

    .photo-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--light-gray);
      margin-bottom: 48px;
    }
    .photo-tab {
      position: relative;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--gray);
      cursor: pointer;
      border: none;
      background: none;
      letter-spacing: 0.02em;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .photo-tab::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--black);
      transform: scaleX(0);
      transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    }
    .photo-tab:hover { color: var(--black); }
    .photo-tab.active { color: var(--black); }
    .photo-tab.active::after { transform: scaleX(1); }

    .photo-panel { display: none; }
    .photo-panel.active { display: block; }

    .photo-panel-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 24px;
    }

    .photo-grid {
      columns: 3;
      column-gap: 12px;
    }
    .photo-grid img {
      width: 100%;
      display: block;
      margin-bottom: 12px;
      border-radius: 4px;
      cursor: zoom-in;
      transition: opacity 0.2s;
    }
    .photo-grid img:hover { opacity: 0.88; }

    @media (max-width: 900px) {
      .photo-page { padding: 40px 24px 60px; }
      .photo-grid { columns: 2; }
      .photo-tab { padding: 10px 16px; font-size: 0.875rem; }
    }
    @media (max-width: 560px) {
      .photo-grid { columns: 1; }
    }
  </style>
</head>

  <script>
    function activateTab(panel) {
      document.querySelectorAll('.photo-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.photo-panel').forEach(p => p.classList.remove('active'));
      var tab = document.querySelector('[data-panel="' + panel + '"]');
      if (tab) {
        tab.classList.add('active');
        document.getElementById('panel-' + panel).classList.add('active');
      }
    }

    document.querySelectorAll('.photo-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        activateTab(tab.dataset.panel);
        history.replaceState(null, '', '#' + tab.dataset.panel);
      });
    });

    // Handle hash on page load (from redirects)
    var hash = window.location.hash.replace('#', '');
    if (hash === 'engagement' || hash === 'kids') {
      activateTab(hash);
    }
  </script>
