<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Design — Marc Laurente</title>
  <link rel="stylesheet" href="style.css" />
  <script>if(localStorage.getItem("darkMode")==="1")document.documentElement.classList.add("dark-init");</script>
  <script>
(function() {
  var SUPABASE_URL = "https://xzprnvdfvzvwuumqythy.supabase.co";
  var SUPABASE_KEY = "sb_publishable_LdH4UHznTdm6dcs8g6UcTw_Lm1MR23j";
  var sessionId = sessionStorage.getItem("_sid") || (function() {
    var id = Math.random().toString(36).slice(2);
    sessionStorage.setItem("_sid", id);
    return id;
  })();
  var startTime = Date.now();
  var maxScroll = 0;
  window.addEventListener("scroll", function() {
    var pct = Math.round((window.scrollY + window.innerHeight) / document.body.scrollHeight * 100);
    if (pct > maxScroll) maxScroll = Math.min(pct, 100);
  });
  function getLocation(cb) {
    fetch("https://ipapi.co/json/")
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.city) { cb({ city: d.city, country: d.country_name }); return; }
        throw new Error("empty");
      })
      .catch(function() {
        fetch("http://ip-api.com/json/?fields=city,country")
          .then(function(r) { return r.json(); })
          .then(function(d) { cb({ city: d.city || null, country: d.country || null }); })
          .catch(function() { cb({}); });
      });
  }
  function sendVisit() {
    getLocation(function(loc) {
      var payload = JSON.stringify({
        page: location.href,
        referrer: document.referrer || "direct",
        session_id: sessionId,
        scroll_depth: maxScroll,
        time_on_page: Math.round((Date.now() - startTime) / 1000),
        city: loc.city || null,
        country: loc.country || null,
        user_agent: navigator.userAgent
      });
      fetch(SUPABASE_URL + "/rest/v1/page_views", {
        method: "POST", keepalive: true,
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY,
                   "Content-Type": "application/json", "Prefer": "return=minimal" },
        body: payload
      });
    });
  }
  window.addEventListener("beforeunload", sendVisit);
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "hidden") sendVisit();
  });
})();
  </script>
</head>
<body>
  <script src="nav.js"></script>

  <div class="logos-section">
    <h1>Logo Design</h1>
    <p class="subtitle">A selection of logos designed for various clients and organizations.</p>

    <div class="logos-grid">

      <div class="logo-card">
        <img src="images/logos/listings.jpg" alt="Listings" />
      </div>

      <div class="logo-card">
        <img src="images/logos/cloudview.webp" alt="Cloudview Partners" />
      </div>

      <div class="logo-card">
        <img src="images/logos/sh-apple.jpg" alt="SH" />
      </div>




      <div class="logo-card">
        <img src="images/logos/global-warming.jpg" alt="Global Warming Solutions" />
      </div>


      <div class="logo-card">
        <img src="images/logos/njheps-pink.jpg" alt="NJ HEPS" />
      </div>

      <div class="logo-card">
        <img src="images/logos/njheps-blue.jpg" alt="NJ HEPS" />
      </div>

    </div>
  </div>

  <script src="lightbox.js"></script>
  <footer>
    <span class="footer-name">Marc Laurente</span>
    <span class="footer-meta">Senior Product Designer · New Jersey · © 2026</span>
    <div class="footer-links">
      <a href="https://www.linkedin.com/in/marclaurente" target="_blank">LinkedIn</a>
      <a href="mailto:sayhello@marclaurente.com">Email</a>
